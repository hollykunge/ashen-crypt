<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182e2a">
  <title>余烬地牢</title>
  <link rel="icon" href="mobile/art/immortals/seal.png">
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wordmark"><span class="sigil" aria-hidden="true">山海</span>余烬地牢</div>
    <button id="sound" class="utility" type="button" aria-pressed="false">音效关闭</button>
  </header>

  <main>
    <section id="selection" class="selection" aria-labelledby="selection-title">
      <div class="selection-heading">
        <p class="overline">昆仑山 · 点将台</p>
        <h1 id="selection-title">列仙图录</h1>
        <div class="editions" role="group" aria-label="选择神仙名册">
          <button type="button" data-style="0" aria-pressed="true">男仙</button>
          <button type="button" data-style="1" aria-pressed="false">女仙</button>
        </div>
      </div>
      <div class="selection-controls">
        <div class="classes" role="group" aria-label="选择出战神仙">
          <button type="button" class="class-choice" data-class="knight" aria-pressed="true">
            <span class="sprite-stand"><img src="mobile/art/immortals/portrait-0.webp" alt="" draggable="false"></span>
            <span class="class-caption"><strong class="class-title">二郎神</strong><span class="class-role">神将 · 近战</span></span>
          </button>
          <button type="button" class="class-choice" data-class="ranger" aria-pressed="false">
            <span class="sprite-stand"><img src="mobile/art/immortals/portrait-2.webp" alt="" draggable="false"></span>
            <span class="class-caption"><strong class="class-title">后羿</strong><span class="class-role">神射 · 远程</span></span>
          </button>
          <button type="button" class="class-choice" data-class="mage" aria-pressed="false">
            <span class="sprite-stand"><img src="mobile/art/immortals/portrait-4.webp" alt="" draggable="false"></span>
            <span class="class-caption"><strong class="class-title">雷部天师</strong><span class="class-role">雷法 · 范围</span></span>
          </button>
        </div>
        <p id="class-detail" aria-live="polite"></p>
        <div class="commission">
          <img class="patron" src="mobile/art/immortals/patron-0.webp" alt="">
          <div><span class="overline">土地公敕令</span><h2>清山门</h2><p>山魈盘踞石阶，请为进香人开路。</p></div>
          <button id="start" type="button" class="primary">领令出战 <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <section id="battle" class="battle" aria-label="昆仑山门战斗" hidden>
      <div class="battle-top">
        <img class="patron" id="patron" src="mobile/art/immortals/patron-0.webp" alt="">
        <div class="order-text">
          <span class="overline" id="issuer">土地公敕令</span>
          <h1 id="wave">清山门</h1>
        </div>
        <div class="battle-counts">
          <span>击杀 <strong id="kills">0</strong></span>
          <span>灵砂 <strong id="ash">0</strong></span>
          <button id="pause" class="utility" type="button">暂停 <kbd>Esc</kbd></button>
        </div>
      </div>
      <p class="mission-line"><span id="objective"></span><span>余敌 <strong id="remaining">0</strong></span></p>
      <div class="playfield">
        <canvas id="arena" width="1100" height="660" aria-label="战斗场地"></canvas>
        <p id="callout" class="callout" aria-live="polite"></p>
        <div id="overlay" class="overlay" hidden>
          <div class="result" role="dialog" aria-modal="true" aria-labelledby="result-title">
            <h2 id="result-title"></h2>
            <p id="result-details"></p>
            <button id="continue" class="primary" type="button"></button>
            <button id="leave" class="utility" type="button">返回图录</button>
          </div>
        </div>
      </div>
      <div class="battle-bottom">
        <div class="vitals">
          <div class="vitals-label"><strong id="player-class"></strong><span id="health-text"></span></div>
          <div id="health" class="meter health" role="progressbar" aria-label="生命"><span></span></div>
          <div class="vitals-label level"><span id="level"></span><span id="xp-text"></span></div>
          <div id="xp" class="meter xp" role="progressbar" aria-label="经验"><span></span></div>
        </div>
        <div class="battle-actions">
          <button id="attack" class="action" type="button"><kbd>J</kbd><span>普攻</span></button>
          <button id="skill" class="action" type="button"><kbd>Q</kbd><span>技能</span></button>
          <button id="dash" class="action" type="button"><kbd>空格</kbd><span>后撤</span></button>
        </div>
      </div>
    </section>
  </main>

  <footer hidden>
    <span id="keyboard-help"><kbd>A / D</kbd> 后退 / 前进 <span class="divider">/</span> <kbd>W / S</kbd> 小步侧移 <span class="divider">/</span> <kbd>鼠标 / J</kbd> 普攻 <span class="divider">/</span> <kbd>Q</kbd> 技能 <span class="divider">/</span> <kbd>空格</kbd> 后撤</span>
    <span id="touch-help">轻触地面短步进退，用下方按钮攻击或后撤</span>
  </footer>
</body>
</html>
